<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-landing.css">
</head>

<body>
    <!-- Landing View -->
    <div id="landing-view" class="landing-container">

        <div class="landing-options">
            <h1>Wheel of Fortune</h1>
            <button id="landing-create-btn" class="primary-btn">Create New</button>
            <div class="divider">OR</div>
            <div class="join-team">
                <input type="text" id="team-code-input" placeholder="# team code">
                <button id="landing-join-btn">Join</button>
            </div>
        </div>
    </div>

    <!-- App View -->
    <div id="app-view" class="hidden">
        <div class="container">
            <h1 class="winner" id="result" class="result hidden"></h1>

            <div class="wheel-container">
                <canvas id="wheel" width="500" height="500"></canvas>
                <div class="arrow-container">
                    <div class="arrow"></div>
                </div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <input type="text" id="name-input" placeholder="Enter a name">
                    <button id="add-btn">Add</button>
                </div>

            </div>

            <button id="spin-btn">SPIN</button>

        </div>
        <div id="stats" class="stats"></div>
        <div class="bottom-controls">
            <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
            <button id="palette-btn" class="icon-btn" title="Toggle Colors">🎨</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="fire.js"></script>
    <script src="script.js"></script>
</body>

</html>
