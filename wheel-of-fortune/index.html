<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-landing.css">
</head>

<body>
    <!-- Landing View -->
    <div id="landing-view" class="landing-container">

        <div class="landing-options">
            <h1>Wheel of Fortune</h1>
            <button id="landing-create-btn" class="primary-btn">Create new</button>
            <div class="divider">OR</div>
            <div class="join-team">
                <input type="text" id="team-code-input" placeholder="# team code">
                <button id="landing-join-btn" aria-label="Join Team">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- App View -->
    <div id="app-view" class="hidden">
        <div class="container">
            <h1 class="winner" id="result" class="result hidden"></h1>

            <div class="wheel-container">
                <canvas id="wheel" width="500" height="500"></canvas>
                <div class="arrow-container">
                    <div class="arrow"></div>
                </div>
            </div>

            <div class="controls">
            </div>

            <button class="spin-button" id="spin-btn">SPIN</button>

        </div>
        <div id="stats" class="stats"></div>
        <div class="bottom-controls">
            <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
            <button id="palette-btn" class="icon-btn" title="Toggle Colors">🎨</button>
            <div class="add-name-container">
                <input type="text" id="name-input" placeholder="Enter a name">
                <button id="add-btn" title="Add Name">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="fire.js"></script>
    <script src="script.js"></script>
</body>

</html>
